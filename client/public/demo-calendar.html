<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日历 · Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1000px 600px at -10% -20%, rgba(64,156,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% -10%, rgba(175,82,222,0.08), transparent 60%),
      linear-gradient(180deg, #f7f8fb 0%, #eef1f7 100%);
    color: #1d1d1f;
    min-height: 100vh;
    padding: 36px 24px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1020px; margin: 0 auto; }

  /* ===== Glass Card ===== */
  .glass {
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 8px 32px rgba(0,0,0,0.06);
  }

  .page-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .page-head .title {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 700; color: #1c1c1e;
  }
  .page-head .title .icon {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, #007aff, #5ac8fa);
    display: inline-flex; align-items: center; justify-content: center;
    color: white;
  }
  .quick-today {
    padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500;
    background: rgba(0,122,255,0.1); color: #007aff; border: none; cursor: pointer;
  }
  .quick-today:hover { background: rgba(0,122,255,0.18); }

  /* ===== Calendar ===== */
  .calendar-wrap { padding: 22px 24px; }
  .cal-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .cal-top .ym { font-size: 17px; font-weight: 600; color: #1c1c1e; }
  .cal-nav { display: flex; gap: 6px; align-items: center; }
  .cal-nav button {
    width: 32px; height: 32px; border: none; background: rgba(120,120,128,0.12);
    border-radius: 8px; cursor: pointer; color: #1c1c1e; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .cal-nav button:hover { background: rgba(0,122,255,0.12); color: #007aff; }
  .cal-nav .today-btn {
    width: auto; padding: 0 12px;
    font-size: 12px; font-weight: 500;
  }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-wd {
    text-align: center; font-size: 12px; color: #8e8e93;
    padding: 6px 0 10px; font-weight: 600;
  }
  .cal-day {
    position: relative; aspect-ratio: 1 / 1.1;
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s;
    background: transparent;
  }
  .cal-day:hover { background: rgba(120,120,128,0.08); }
  .cal-day .d {
    font-size: 14px; font-weight: 500; color: #1c1c1e;
    line-height: 1;
  }
  .cal-day.empty { cursor: default; }
  .cal-day.past .d { color: #c7c7cc; }
  .cal-day.today {
    background: rgba(0,122,255,0.12);
    box-shadow: inset 0 0 0 2px rgba(0,122,255,0.55);
  }
  .cal-day.today .d { color: #007aff; font-weight: 700; }
  .cal-day.selected {
    background: rgba(0,122,255,0.18);
    box-shadow: inset 0 0 0 2px rgba(0,122,255,0.8);
  }
  .cal-day.selected .d { color: #007aff; font-weight: 700; }
  .cal-dot {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 3px;
  }
  .cal-dot i {
    width: 5px; height: 5px; border-radius: 50%;
    background: transparent;
  }
  .cal-day.past .cal-dot i.p { background: #c7c7cc; }
  .cal-day.past .cal-dot i.n { background: #e5e5ea; }
  .cal-day:not(.past):not(.today) .cal-dot i.p { background: #ff3b30; }
  .cal-day:not(.past):not(.today) .cal-dot i.n { background: #8e8e93; }
  .cal-day.today .cal-dot i.p, .cal-day.today .cal-dot i.n { background: #007aff; }

  /* ===== Day Details ===== */
  .detail-wrap { margin-top: 20px; padding: 22px 24px; }
  .detail-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .detail-head .date { font-size: 15px; font-weight: 600; color: #1c1c1e; }
  .detail-head .count { font-size: 13px; color: #8e8e93; font-weight: 500; }
  .detail-head .count b { color: #007aff; font-weight: 600; }

  .event-list { display: flex; flex-direction: column; gap: 8px; }
  .event {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  .event:hover { background: rgba(120,120,128,0.06); }
  .event .left {
    width: 3px; align-self: stretch;
    border-radius: 2px;
  }
  .event.p-1 .left { background: linear-gradient(180deg, #ff3b30, #ff6b5a); }
  .event.p-2 .left { background: linear-gradient(180deg, #ff9500, #ffcc00); }
  .event.p-3 .left { background: linear-gradient(180deg, #8e8e93, #aeaeb2); }
  .event.p-4 .left { background: linear-gradient(180deg, #34c759, #30d158); }

  .event .mid { flex: 1; min-width: 0; }
  .event .t1 {
    font-size: 14px; font-weight: 600; color: #1c1c1e;
    display: flex; align-items: center; gap: 6px;
  }
  .event .t1 .emoji { font-size: 14px; }
  .event .t2 {
    font-size: 12px; color: #8e8e93; margin-top: 3px;
  }
  .event.done .t1 { color: #8e8e93; text-decoration: line-through; }
  .event .chk {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid #c7c7cc;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .event.done .chk {
    background: #34c759; border-color: #34c759;
  }
  .event.done .chk::after {
    content: '✓'; color: white; font-size: 11px; font-weight: 700;
  }
  .event .chip {
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: rgba(120,120,128,0.12); color: #8e8e93; font-weight: 500;
    flex-shrink: 0;
  }

  /* ===== Month Stats (floating summary bar) ===== */
  .stat-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-top: 16px; padding: 14px;
    background: rgba(120,120,128,0.06);
    border-radius: 14px;
  }
  .stat-bar .s-item {
    text-align: center;
  }
  .stat-bar .s-num {
    font-size: 18px; font-weight: 700; color: #1c1c1e;
    line-height: 1;
  }
  .stat-bar .s-label {
    font-size: 11px; color: #8e8e93; margin-top: 4px; font-weight: 500;
  }
  .stat-bar .s-item.blue .s-num { color: #007aff; }
  .stat-bar .s-item.red .s-num { color: #ff3b30; }
  .stat-bar .s-item.green .s-num { color: #34c759; }
</style>
</head>
<body>
<div class="wrap">

  <div class="page-head">
    <div class="title">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      </span>
      日历
    </div>
    <button class="quick-today">回到今天</button>
  </div>

  <div class="glass calendar-wrap">
    <div class="cal-top">
      <div class="ym">2026 年 8 月</div>
      <div class="cal-nav">
        <button title="上月">‹</button>
        <button class="today-btn">今天</button>
        <button title="下月">›</button>
      </div>
    </div>

    <div class="cal-grid">
      <div class="cal-wd">日</div>
      <div class="cal-wd">一</div>
      <div class="cal-wd">二</div>
      <div class="cal-wd">三</div>
      <div class="cal-wd">四</div>
      <div class="cal-wd">五</div>
      <div class="cal-wd">六</div>

      <!-- 第1周 8/1-8/2 -->
      <div class="cal-day empty"></div>
      <div class="cal-day empty"></div>
      <div class="cal-day empty"></div>
      <div class="cal-day empty"></div>
      <div class="cal-day past"><div class="d">1</div><div class="cal-dot"><i class="p"></i></div></div>
      <div class="cal-day past"><div class="d">2</div><div class="cal-dot"><i class="n"></i></div></div>
      <div class="cal-day past"><div class="d">3</div><div class="cal-dot"><i class="p"></i></div></div>

      <!-- 第2周 8/4-8/10 含今天8/9 -->
      <div class="cal-day past"><div class="d">4</div><div class="cal-dot"><i class="n"></i></div></div>
      <div class="cal-day past"><div class="d">5</div><div class="cal-dot"><i class="p"></i></div></div>
      <div class="cal-day past"><div class="d">6</div><div class="cal-dot"><i class="p"></i></div></div>
      <div class="cal-day past"><div class="d">7</div><div class="cal-dot"><i class="p"></i></div></div>
      <div class="cal-day past"><div class="d">8</div><div class="cal-dot"><i class="p"></i></div></div>
      <div class="cal-day today selected"><div class="d">9</div><div class="cal-dot"><i class="p"></i><i class="n"></i></div></div>
      <div class="cal-day"><div class="d">10</div><div class="cal-dot"><i class="n"></i></div></div>

      <!-- 第3周 8/11-8/17 -->
      <div class="cal-day"><div class="d">11</div><div class="cal-dot"><i class="p"></i></div></div>
      <div class="cal-day"><div class="d">12</div></div>
      <div class="cal-day"><div class="d">13</div></div>
      <div class="cal-day"><div class="d">14</div><div class="cal-dot"><i class="n"></i></div></div>
      <div class="cal-day"><div class="d">15</div></div>
      <div class="cal-day"><div class="d">16</div><div class="cal-dot"><i class="p"></i><i class="n"></i></div></div>
      <div class="cal-day"><div class="d">17</div></div>

      <!-- 第4周 8/18-8/24 -->
      <div class="cal-day"><div class="d">18</div></div>
      <div class="cal-day"><div class="d">19</div></div>
      <div class="cal-day"><div class="d">20</div><div class="cal-dot"><i class="p"></i></div></div>
      <div class="cal-day"><div class="d">21</div></div>
      <div class="cal-day"><div class="d">22</div><div class="cal-dot"><i class="n"></i></div></div>
      <div class="cal-day"><div class="d">23</div></div>
      <div class="cal-day"><div class="d">24</div></div>

      <!-- 第5周 8/25-8/31 -->
      <div class="cal-day"><div class="d">25</div><div class="cal-dot"><i class="p"></i></div></div>
      <div class="cal-day"><div class="d">26</div></div>
      <div class="cal-day"><div class="d">27</div></div>
      <div class="cal-day"><div class="d">28</div></div>
      <div class="cal-day"><div class="d">29</div><div class="cal-dot"><i class="n"></i></div></div>
      <div class="cal-day"><div class="d">30</div></div>
      <div class="cal-day"><div class="d">31</div><div class="cal-dot"><i class="p"></i></div></div>
    </div>

    <div class="stat-bar">
      <div class="s-item blue"><div class="s-num">41</div><div class="s-label">本月事项</div></div>
      <div class="s-item red"><div class="s-num">12</div><div class="s-label">重点事</div></div>
      <div class="s-item green"><div class="s-num">25</div><div class="s-label">已完成</div></div>
      <div class="s-item"><div class="s-num">61%</div><div class="s-label">完成率</div></div>
    </div>
  </div>

  <!-- 日详情 -->
  <div class="glass detail-wrap">
    <div class="detail-head">
      <div class="date">
        8月9日 · 星期日
      </div>
      <div class="count">
        共 <b>4</b> 件事 · 已完成 <b>3</b> 件
      </div>
    </div>

    <div class="event-list">
      <div class="event p-4 done">
        <div class="left"></div>
        <div class="mid">
          <div class="t1"><span class="emoji">🏃</span>每日运动</div>
          <div class="t2">06:00 – 07:00 · 1 小时</div>
        </div>
        <div class="chip">习惯</div>
        <div class="chk"></div>
      </div>
      <div class="event p-2 done">
        <div class="left"></div>
        <div class="mid">
          <div class="t1"><span class="emoji">🎤</span>即兴表达练习</div>
          <div class="t2">07:00 – 07:15 · 15 分钟</div>
        </div>
        <div class="chip">能力</div>
        <div class="chk"></div>
      </div>
      <div class="event p-2 done">
        <div class="left"></div>
        <div class="mid">
          <div class="t1"><span class="emoji">🔠</span>英语口语练习</div>
          <div class="t2">07:15 – 07:30 · 15 分钟</div>
        </div>
        <div class="chip">能力</div>
        <div class="chk"></div>
      </div>
      <div class="event p-3">
        <div class="left"></div>
        <div class="mid">
          <div class="t1"><span class="emoji">📖</span>看书 30m</div>
          <div class="t2">07:30 – 08:00 · 30 分钟</div>
        </div>
        <div class="chip">知力</div>
        <div class="chk"></div>
      </div>
    </div>
  </div>

</div>



</body></html>
